org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Pin the build to JDK 17 so it works regardless of which Android Studio JBR
# (21 or 25) is active — Gradle 8.7 / AGP 8.3.2 need Java <= 22. Local-machine
# path; adjust if your JDK 17 lives elsewhere.
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
